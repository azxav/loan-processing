version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - MONGODB_DB=${MONGODB_DB:-loan_automation}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL_VERSION=${GEMINI_MODEL_VERSION:-gemini-2.5-flash-lite}
      - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS:-30}
      - MAX_PARALLEL_AGENTS=${MAX_PARALLEL_AGENTS:-5}
      - ENABLE_AGENT_LOGGING=${ENABLE_AGENT_LOGGING:-true}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-*}
    depends_on:
      - mongo

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://backend:8000/api/v1}
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://backend:8000/api/v1}
    ports:
      - "3000:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
